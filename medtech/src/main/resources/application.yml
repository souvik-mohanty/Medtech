server:
  # Render (and most PaaS hosts) assign the port dynamically via $PORT — the
  # app must listen on whatever it provides, not a fixed 8080, or the
  # platform's health check never finds it. Defaults to 8080 for local dev.
  port: ${PORT:8080}

spring:
  application:
    name: medtech

  # -------------------- PostgreSQL --------------------
  # Defaults to local Docker Postgres (port 5434, not the default 5432 —
  # this machine already has other projects' Postgres containers bound to
  # 5432 and 5433). Override via env vars (DB_URL/DB_USERNAME/DB_PASSWORD)
  # or the gitignored application-local.yml (see that file / README.md) to
  # point at a hosted database (e.g. Neon) instead — never put real
  # non-local credentials directly in this file, it's committed to git.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/medtech}
    username: ${DB_USERNAME:medtech}
    password: ${DB_PASSWORD:medtech}

  # -------------------- JPA / Hibernate --------------------
  jpa:
    # Flyway (below) owns the schema — Hibernate must never auto-generate DDL
    # against a real database. "validate" catches entity/schema drift early.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # -------------------- Flyway --------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

  # -------------------- Jackson --------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # -------------------- Validation --------------------
  mvc:
    throw-exception-if-no-handler-found: true

  # -------------------- Thymeleaf (for invoice PDFs later) --------------------
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  # -------------------- Multipart uploads --------------------
  # Spring Boot's own default is 1MB per file, easily exceeded by a real
  # scanned lab report PDF — see lab.service.LabReportService#upload.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  # -------------------- Kafka --------------------
  # Defaults to a local broker (see docker-compose.yml at the repo root:
  # `docker compose up kafka`). Only one event flows through it today — a
  # patient's own online lab booking (LabTestBookingService#bookTest ->
  # BookingEventProducer) — see config.KafkaTopicConfig for the topic and
  # notification.listener.BookingEventListener for the consumer. Everything
  # else in the app still notifies synchronously; see NotificationService's
  # class doc for why.
  kafka:
    # Port 29092, not Kafka's usual 9092 — see docker-compose.yml's kafka
    # service comment for why.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: medtech-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.company.medtech.lab.event.BookingCreatedEvent
        spring.json.trusted.packages: com.company.medtech.lab.event

# -------------------- JWT --------------------
jwt:
  secret: medtech-secret-key-change-this-immediately
  expiration: 86400000   # 24 hours (in ms)

# -------------------- CORS --------------------
# Local dev origin for lp-care-web (Vite, pinned to :5180 in its
# vite.config.ts — see that file for why it isn't Vite's default :5173),
# plus the live production frontend (Vercel). Every request from the
# deployed site — including the OAuth login call — is rejected by the
# browser if its origin isn't listed here, regardless of how Google's own
# side is configured.
cors:
  allowed-origins:
    - http://localhost:5180
    - https://lpcarepathology.vertexcodelabs.in

# -------------------- Google OAuth --------------------
# Web/Android/iOS OAuth 2.0 client ID from Google Cloud Console. The ID token's
# "aud" claim must match this value. This is a client ID, not a secret — safe
# to commit/embed in clients. Never put the matching client SECRET here or
# anywhere else in this codebase: the ID-token verification flow used by
# GoogleOAuthService never needs it.
google:
  oauth:
    client-id: 688656564041-ou8cogslqaon8gfafstqqe38jpvackn6.apps.googleusercontent.com

# -------------------- Credential encryption --------------------
# Used to encrypt franchise-owned payment gateway secrets at rest (see
# PaymentGatewayConfig). 256-bit AES key, base64-encoded. This default is a
# random dev key generated for this scaffold — replace it for any real
# deployment (rotating it invalidates all previously-encrypted secrets).
security:
  credential-encryption-key: VSi0hZ4P/bm1h1f9YQinWFKW5BwhCXxtT1SXmEcHWsg=

# -------------------- Actuator --------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  # -------------------- Grafana Cloud (production monitoring) --------------------
  # Render has no built-in Prometheus server to scrape /actuator/prometheus, so
  # instead of scraping, the app itself PUSHES metrics on an interval straight
  # to a hosted Grafana Cloud instance's OTLP endpoint. Off by default (no url
  # configured) so local dev and tests never try to reach the internet — set
  # GRAFANA_CLOUD_OTLP_ENDPOINT/GRAFANA_CLOUD_OTLP_TOKEN as Render env vars to
  # turn it on (Grafana Cloud's free tier: Connections -> Add new connection ->
  # OpenTelemetry (OTLP) gives you both). Local /actuator/prometheus scraping
  # (docker-compose's prometheus service) is unaffected either way.
  otlp:
    metrics:
      export:
        enabled: ${GRAFANA_CLOUD_OTLP_ENABLED:false}
        url: ${GRAFANA_CLOUD_OTLP_ENDPOINT:http://localhost:4318/v1/metrics}
        headers:
          Authorization: ${GRAFANA_CLOUD_OTLP_TOKEN:}
        step: 30s

# -------------------- Logging --------------------
logging:
  level:
    root: INFO
    org.springframework.security: INFO
